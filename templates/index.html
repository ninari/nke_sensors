<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NKE Sensor Dashboard</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    background:#f4f6f8;
    font-family:Arial,sans-serif;
}

.card{
    margin-top:15px;
}

.sensor-value{
    font-size:2rem;
    font-weight:bold;
    color:#0d6efd;
}

canvas{
    height:250px !important;
}

</style>

</head>

<body class="container">

<h1 class="text-center mt-4">
NKE Water Quality Dashboard
</h1>

<div class="card">
    <div class="card-body">

        <div class="d-flex gap-2">

            <button
                class="btn btn-success"
                onclick="startMonitoring()">
                START
            </button>

            <button
                class="btn btn-danger"
                onclick="stopMonitoring()">
                STOP
            </button>

            <button
                class="btn btn-primary"
                onclick="exportCSV()">
                EXPORT CSV
            </button>

        </div>

    </div>
</div>

<div class="card">
    <div class="card-body">

        <h5>Status</h5>

        <p id="system-status">
            Waiting for data...
        </p>

    </div>
</div>

<div class="row">

<div class="col-md-6">

<div class="card">
<div class="card-body">
    
<h5>Temperature</h5>
    
<div
id="temperature-value"
class="sensor-value">
--
</div>
    
<canvas id="temperatureChart"></canvas>
    
</div>
</div>
    
</div>


<div class="col-md-6">

<div class="card">
<div class="card-body">
    
<h5>Chlorophyll</h5>
    
<div
id="chlorophyll-value"
class="sensor-value">
--
</div>
    
<canvas id="chlorophyllChart"></canvas>
    
</div>
</div>
    
</div>




<div class="col-md-6">

<div class="card">
<div class="card-body">

<h5>pH</h5>

<div
id="ph-value"
class="sensor-value">
--
</div>

<canvas id="phChart"></canvas>

</div>
</div>

</div>

<div class="col-md-6">

<div class="card">
<div class="card-body">

<h5>Conductivity</h5>

<div
id="ec-value"
class="sensor-value">
--
</div>

<canvas id="ecChart"></canvas>

</div>
</div>

</div>

<div class="col-md-6">

<div class="card">
<div class="card-body">

<h5>Dissolved Oxygen</h5>

<div
id="do-value"
class="sensor-value">
--
</div>

<canvas id="doChart"></canvas>

</div>
</div>

</div>

<div class="col-md-6">

<div class="card">
<div class="card-body">

<h5>Turbidity</h5>

<div
id="turbidity-value"
class="sensor-value">
--
</div>

<canvas id="turbidityChart"></canvas>

</div>
</div>

</div>

</div>

<div class="card">
<div class="card-body">

<h5>MAVLink Attitude</h5>

<canvas id="attitudeChart"></canvas>

</div>
</div>

<div class="card">
<div class="card-body">

<h5>MAVLink GPS Altitude</h5>

<canvas id="gpsChart"></canvas>

</div>
</div>

<script>

let timer = null;

const MAX_POINTS = 30;

function exportCSV(){

    window.location.href = "/export";

}

function createChart(id,label,color){

    return new Chart(
        document.getElementById(id),
        {
            type:'line',

            data:{
                labels:[],
                datasets:[
                {
                    label:label,
                    data:[],
                    borderColor:color,
                    pointRadius:5,
                    pointHoverRadius:7,
                    borderWidth:2,
                    tension:0.2,
                    fill:false
                }]
            },

            options:{
                responsive:true,
                maintainAspectRatio:false,
                animation:false,
                scales:{
                    y:{
                        beginAtZero:false
                    }
                }
            }
        }
    );
}

const temperatureChart =
createChart(
    "temperatureChart",
    "Temperature",
    "#dc3545"
);

const chlorophyllChart =
createChart(
    "chlorophyllChart",
    "Chlorophyll",
    "#198754"
);


const phChart =
createChart(
    "phChart",
    "pH",
    "#0d6efd"
);

const ecChart =
createChart(
    "ecChart",
    "Conductivity",
    "#198754"
);

const doChart =
createChart(
    "doChart",
    "DO",
    "#20c997"
);

const turbidityChart =
createChart(
    "turbidityChart",
    "Turbidity",
    "#ffc107"
);

const gpsChart =
createChart(
    "gpsChart",
    "Altitude",
    "#6f42c1"
);

const attitudeChart =
new Chart(
document.getElementById("attitudeChart"),
{
    type:"line",

    data:{
        labels:[],
        datasets:[
        {
            label:"Roll",
            data:[],
            borderColor:"red",
            pointRadius:5,
            pointHoverRadius:7,
            borderWidth:2,
            tension:0.2,
            fill:false
        },
        {
            label:"Pitch",
            data:[],
            borderColor:"green"
        },
        {
            label:"Yaw",
            data:[],
            borderColor:"blue"
        }]
    },

    options:{
        responsive:true,
        animation:false
    }
});

function addPoint(chart,value){

    chart.data.labels.push(
        new Date().toLocaleTimeString()
    );

    chart.data.datasets[0].data.push(
        value
    );

    if(
        chart.data.labels.length >
        MAX_POINTS
    ){

        chart.data.labels.shift();

        chart.data.datasets[0]
        .data.shift();
    }

    chart.update();
}

async function updateSensors(){

    try{

        const response =
            await fetch(
                "/modbus/data"
            );

        const data =
            await response.json();

        console.log(data);

        if(
            data.status ===
            "waiting_for_data"
        ){
            return;
        }

        document.getElementById(
            "system-status"
        ).textContent =
        "Connected";

        document.getElementById(
            "temperature-value"
        ).textContent =
        data.temperature.toFixed(2) + " °C";

        document.getElementById(
            "chlorophyll-value"
        ).textContent =
            data.chlorophyll;

        document.getElementById(
            "ph-value"
        ).textContent =
        data.ph.toFixed(2);

        document.getElementById(
            "ec-value"
        ).textContent =
        data.conductivity +
        " µS/cm";

        document.getElementById(
            "do-value"
        ).textContent =
        data.dissolved_oxygen_mg_l.toFixed(2)
        + " mg/L";

        document.getElementById(
            "turbidity-value"
        ).textContent =
        data.turbidity.toFixed(1)
        + " NTU";

        addPoint(
            temperatureChart,
            Number(data.temperature)
        );
        
        addPoint(
            chlorophyllChart,
            Number(data.chlorophyll)
        );

        addPoint(
            phChart,
            Number(data.ph)
        );

        addPoint(
            ecChart,
            Number(data.conductivity)
        );

        addPoint(
            doChart,
            Number(data.dissolved_oxygen_mg_l)
        );

        addPoint(
            turbidityChart,
            Number(data.turbidity)
        );

    }
    catch(error){

        document.getElementById(
            "system-status"
        ).textContent =
        "Modbus Offline";

        console.log(error);
    }
}

async function updateAttitude(){

    try{

        const response =
        await fetch(
            "/mavlink/attitude"
        );

        const att =
        await response.json();

        attitudeChart.data.labels.push(
            new Date()
            .toLocaleTimeString()
        );

        attitudeChart.data.datasets[0]
        .data.push(
            att.roll || 0
        );

        attitudeChart.data.datasets[1]
        .data.push(
            att.pitch || 0
        );

        attitudeChart.data.datasets[2]
        .data.push(
            att.yaw || 0
        );

        if(
            attitudeChart
            .data
            .labels
            .length >
            MAX_POINTS
        ){

            attitudeChart
            .data
            .labels
            .shift();

            attitudeChart
            .data
            .datasets
            .forEach(
                ds => ds.data.shift()
            );
        }

        attitudeChart.update();

    }
    catch(error){

        console.log(error);

    }
}

async function updateGPS(){

    try{

        const response =
        await fetch(
            "/mavlink/gps"
        );

        const gps =
        await response.json();

        addPoint(
            gpsChart,
            gps.alt || 0
        );

    }
    catch(error){

        console.log(error);

    }
}

function startMonitoring(){

    if(timer){
        return;
    }

    document.getElementById(
        "system-status"
    ).textContent =
    "Collecting Data...";

    timer = setInterval(
        async () => {

            await updateSensors();
            await updateAttitude();
            await updateGPS();

        },
        1000
    );
}

function stopMonitoring(){

    clearInterval(timer);

    timer = null;

    document.getElementById(
        "system-status"
    ).textContent =
    "Stopped";
}

</script>

</body>
</html>
